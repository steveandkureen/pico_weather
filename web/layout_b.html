<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1024, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Weather</title>
<style>
html,body{margin:0;padding:0;background:#F4F6F8;overflow:hidden;height:100%}
#wx-root{position:absolute;left:0;top:0;width:1024px;height:768px;-webkit-transform-origin:0 0;transform-origin:0 0;
  display:flex;background:#F4F6F8;color:#13202B;
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums;overflow:hidden}
.band{flex:0 0 390px;height:768px;box-sizing:border-box;padding:32px 34px;background:#13354F;color:#fff;
  display:flex;flex-direction:column;justify-content:space-between}
.bl{margin:0;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#A9C1D4;font-weight:600}
.bs{color:#A9C1D4}
.rule{border-top:1px solid rgba(255,255,255,.18);padding-top:16px}
.main{flex:1 1 auto;box-sizing:border-box;padding:28px;display:flex;flex-direction:column}
.main>*+*{margin-top:20px}
.cards{display:flex;height:196px}
.cards>*+*{margin-left:20px}
.card{background:#fff;border:1px solid #DDE3E8;border-radius:16px;padding:20px 22px;box-sizing:border-box;display:flex;flex-direction:column}
.cl{margin:0;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#5B6B78;font-weight:600}
.cs{color:#5B6B78}
.kv{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px solid #E6EBEF}
.kv:last-child{border-bottom:0;padding-bottom:0}
.band .i-sun{stroke:#F2C66D}.band .i-cloud{stroke:#E4ECF2}.band .i-rain{stroke:#9CCBF2}
.i-sun{stroke:#D9940F}.i-cloud{stroke:#5B6B78}.i-rain{stroke:#1F6FB2}
.hi{color:#C25E12}.lo{color:#1F6FB2}
.fc{flex:1 1 auto;display:flex;flex-direction:column}
.fc>div{flex:1 1 0;display:flex;align-items:center;border-top:1px solid #E6EBEF}
.fc>div.first{border-top:0}
.fc>div>*+*{margin-left:14px}
.track{flex:1 1 auto;height:10px;border-radius:5px;background:#E6EBEF;position:relative}
.track>span{position:absolute;top:0;height:10px;border-radius:5px;background:#C25E12}
.stale-amber{color:#F2C66D !important}
</style>
</head>
<body>
<div id="wx-root">

  <section class="band">
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <h2 class="bl">Outside</h2>
      <span class="bs" style="font-size:14px" data-f="updated">—</span>
    </div>

    <div style="display:flex;flex-direction:column">
      <div style="display:flex;align-items:center">
        <span data-icon="now" style="width:48px;height:48px"></span>
        <span style="font-size:24px;margin-left:12px" data-f="cond">—</span>
      </div>
      <div style="font-size:140px;font-weight:200;line-height:1;letter-spacing:-.04em;margin-left:-6px;margin-top:4px" data-f="out_t">—</div>
    </div>

    <div class="rule" style="display:flex">
      <div style="flex:1 1 0;display:flex;flex-direction:column">
        <span class="bl">Humidity</span>
        <span style="font-size:30px;font-weight:300;margin-top:2px"><span data-f="out_h">—</span><span class="bs" style="font-size:17px">%</span></span>
      </div>
      <div style="flex:1.3 1 0;display:flex;flex-direction:column">
        <span class="bl" data-f="p_label">Pressure</span>
        <span style="font-size:30px;font-weight:300;margin-top:2px"><span data-f="out_p">—</span><span class="bs" style="font-size:15px"> <span data-f="u_p"></span></span></span>
      </div>
    </div>

    <div class="rule" style="display:flex;flex-direction:column">
      <div style="display:flex;align-items:baseline">
        <span class="bl" style="flex:1 1 0">Today</span>
        <span class="bl" style="width:90px;font-size:12px">Actual</span>
        <span class="bl" style="width:90px;font-size:12px">Forecast</span>
      </div>
      <div style="display:flex;align-items:baseline;margin-top:8px">
        <span style="flex:1 1 0;font-size:17px">High</span>
        <span style="width:90px;font-size:32px;font-weight:300" data-f="hi">—</span>
        <span class="bs" style="width:90px;font-size:32px;font-weight:300" data-f="fc_hi">—</span>
      </div>
      <div style="display:flex;align-items:baseline;margin-top:8px">
        <span style="flex:1 1 0;font-size:17px">Low</span>
        <span style="width:90px;font-size:32px;font-weight:300" data-f="lo">—</span>
        <span class="bs" style="width:90px;font-size:32px;font-weight:300" data-f="fc_lo">—</span>
      </div>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,.22);border-radius:12px;padding:14px 18px">
      <span class="bl">Inside</span>
      <span style="font-size:28px;font-weight:300"><span data-f="in_t">—</span> <span class="bs" style="font-size:17px">· <span data-f="in_h">—</span>% humidity</span></span>
    </div>
  </section>

  <div class="main">
    <div class="cards">
      <section class="card" style="flex:1 1 0;justify-content:space-between">
        <h2 class="cl">Wind</h2>
        <div style="display:flex;align-items:center">
          <svg width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Wind direction">
            <circle cx="32" cy="32" r="30" fill="#EAF1F7"/>
            <g data-rot="toward" data-c="32 32">
              <path d="M32 50V16M22 26l10-10 10 10" fill="none" stroke="#13202B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
          </svg>
          <div style="display:flex;flex-direction:column;margin-left:16px">
            <span style="font-size:52px;font-weight:300;line-height:1"><span data-f="wind">—</span><span class="cs" style="font-size:20px"> <span data-f="u_w"></span></span></span>
            <span class="cs" style="font-size:16px;margin-top:4px">from <span data-f="dir_name">—</span> · <span data-f="dir_deg"></span></span>
          </div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid #E6EBEF;padding-top:10px">
          <span class="cl">Gusts</span>
          <span style="font-size:24px"><span data-f="gust">—</span><span class="cs" style="font-size:15px"> <span data-f="u_w"></span></span></span>
        </div>
      </section>

      <section class="card" style="flex:1 1 0;justify-content:space-between">
        <h2 class="cl">Rain</h2>
        <div style="display:flex;flex-direction:column">
          <div class="kv"><span class="cs" style="font-size:17px">Today</span><span style="font-size:28px;font-weight:300"><span data-f="rain_today">—</span><span class="cs" style="font-size:15px"> <span data-f="u_r"></span></span></span></div>
          <div class="kv"><span class="cs" style="font-size:17px">This month</span><span style="font-size:28px;font-weight:300"><span data-f="rain_month">—</span><span class="cs" style="font-size:15px"> <span data-f="u_r"></span></span></span></div>
          <div class="kv"><span class="cs" style="font-size:17px">This year</span><span style="font-size:28px;font-weight:300"><span data-f="rain_year">—</span><span class="cs" style="font-size:15px"> <span data-f="u_r"></span></span></span></div>
        </div>
      </section>
    </div>

    <section class="card" style="flex:1 1 auto;padding:20px 22px 8px">
      <h2 class="cl" style="margin-bottom:6px">Next 5 days <span class="cs" style="text-transform:none;letter-spacing:0;font-weight:400" data-f="fc_age"></span></h2>
      <div class="fc" data-list="fc" data-n="5" data-skip="1">
        <div>
          <span style="width:44px;font-size:19px;font-weight:600" data-k="name"></span>
          <span data-icon="day" style="width:36px;height:36px"></span>
          <span class="cs" style="width:118px;font-size:16px" data-k="cond"></span>
          <span class="lo" style="width:44px;text-align:right;font-size:22px" data-k="lo"></span>
          <div class="track"><span data-bar="h"></span></div>
          <span class="hi" style="width:50px;font-size:22px" data-k="hi"></span>
        </div>
      </div>
    </section>
  </div>
</div>
<script>window.WX_LAYOUT = 'B';</script>
<script src="/app.js"></script>
</body>
</html>
